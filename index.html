<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;background:#0c1a10;overflow:hidden;font-family:'Trebuchet MS',Verdana,Arial,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}

#money{font-size:25px;color:#ffd84a;text-shadow:2px 2px 0 #000;min-width:150px;letter-spacing:1px}
#money small{font-size:12px;color:#cfe;letter-spacing:0}
#beers,#buzz{font-size:14px;color:#fff;text-shadow:1px 1px 0 #000}
#buzz{color:#ffd9a0;font-style:italic}
#mode{font-size:14px;color:#ffb612;margin-left:auto;text-transform:uppercase;letter-spacing:1px}
#hud button{font:bold 13px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;background:#ffb612;color:#203731;border:2px solid #0d2016;border-radius:6px;padding:4px 9px;cursor:pointer}
#hud button:hover{background:#ffd34d}
#cv{position:absolute;left:0;top:40px;width:960px;height:600px;display:block;background:#000;cursor:default;touch-action:none}
#ui{position:absolute;left:0;top:40px;width:960px;height:600px;pointer-events:none;overflow:hidden}
#ui > *{pointer-events:auto}
#ui > .passthru{pointer-events:none}
.modalBack{position:absolute;inset:0;background:rgba(5,15,8,.55);display:flex;align-items:center;justify-content:center;z-index:20}
.modalBack.low{align-items:flex-end;padding-bottom:18px;background:rgba(5,15,8,.15)}
.modal{background:#fffbea;color:#1c2a20;border:5px solid #ffb612;border-radius:16px;box-shadow:0 8px 0 #203731,0 12px 30px rgba(0,0,0,.6);max-width:640px;padding:16px 22px 12px;animation:pop .25s ease-out}
.modal h2{margin:0 0 8px;color:#203731;font-size:24px}
.modal p{margin:6px 0;font-size:16px;line-height:1.35}
.modal .big{font-size:20px;font-weight:bold}
.modal .small{font-size:13px;color:#555}
.modal .joke{font-size:17px;background:#fff3c4;border-left:5px solid #203731;padding:8px 10px;border-radius:6px}

@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
button.btn{font:bold 16px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;background:#ffb612;color:#203731;border:3px solid #203731;border-radius:10px;padding:7px 13px;cursor:pointer;box-shadow:0 4px 0 #203731;margin:5px}
button.btn:hover{background:#ffd34d}
button.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #203731}

@keyframes toastIn{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.floatMoney{position:absolute;left:20px;top:44px;font-weight:bold;font-size:22px;color:#7CFC00;text-shadow:2px 2px 0 #000;animation:floatUp 1.4s ease-out forwards;pointer-events:none;z-index:40}
.floatMoney.neg{color:#ff6b6b}
@keyframes floatUp{from{transform:translateY(0);opacity:1}to{transform:translateY(40px);opacity:0}}
.scenePanel{position:absolute;background:rgba(255,251,234,.96);color:#1c2a20;border:4px solid #ffb612;border-radius:14px;box-shadow:0 6px 0 #203731}

.scenePanel h3{margin:6px 0 4px;color:#203731;font-size:16px}

.hubBtn{position:absolute;transform:translate(-50%,-50%);font:bold 15px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;background:#ffb612;color:#203731;border:3px solid #203731;border-radius:12px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 0 #203731;white-space:nowrap;text-align:center}

.key{display:inline-block;background:#203731;color:#ffb612;border-radius:4px;padding:0 5px;font-size:12px;margin-right:4px}

#sndPanel{position:absolute;right:8px;top:46px;width:270px;background:#fffdf4;color:#203731;border:3px solid #203731;border-radius:10px;padding:8px 12px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.45);font:bold 13px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif}

/* ---------------- touch / mobile ---------------- */
:root{--s:1;--inv:1;--u:64px;--tap:48px;--mz:1}
.scrolly{overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#tc{position:fixed;inset:0;pointer-events:none;z-index:60;display:none;font-family:'Trebuchet MS',Verdana,sans-serif}
body.touch #tc{display:block}
#tc .tcg{display:none}
#tc .tcg.on{display:block}
.tb{position:absolute;pointer-events:auto;touch-action:none;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;font-weight:bold;text-shadow:1px 1px 0 #000;background:rgba(20,45,30,.58);border:3px solid rgba(255,182,18,.9);border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.45);min-width:48px;min-height:48px;transition:transform .06s,background .06s;line-height:1.05}

#tcSteer.tilt{opacity:.45}
#tcReel .ring{position:absolute;inset:-9px;border-radius:50%;pointer-events:none;background:conic-gradient(var(--tcol,#4caf50) calc(var(--tp,0)*1%),rgba(0,0,0,.35) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px));mask:radial-gradient(farthest-side,transparent calc(100% - 9px),#000 calc(100% - 8px))}

.tcBait .ttl{font:bold 12px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;color:#ffd84a;text-shadow:1px 1px 0 #000;pointer-events:none}
#tcTop{position:absolute;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
#tcTop .tb{position:relative;border-radius:12px;width:48px;height:48px;font-size:22px}
#rot{position:fixed;inset:0;z-index:80;background:rgba(8,22,14,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;gap:14px}
#rot.on{display:flex}
#rot .ph{font-size:72px;animation:rotph 1.6s ease-in-out infinite}
@keyframes rotph{0%,20%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rot h2{margin:0;color:#ffb612;font-size:24px}#rot p{margin:0;font-size:16px;max-width:420px}
#rot button{font:bold 18px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;min-height:52px;padding:0 20px;border-radius:12px;border:3px solid #203731;background:#ffb612;color:#203731}
#rot button.alt{background:#fffbea}
button,input,select{font-family:'Trebuchet MS','Liberation Sans',Arial,Roboto,Helvetica,sans-serif!important}
body.touch #hud #mode,body.touch #hud #mapBtn,body.touch #hud #sndBtn,body.touch #hud #muteBtn{display:none}
body.touch .kh,body.touch .key{display:none}
body.touch button.btn{min-height:calc(var(--tap)*var(--inv));min-width:calc(var(--tap)*var(--inv))}

body.touch .modal button.btn{min-height:calc(var(--tap)*var(--inv) / var(--mz))}
body.touch .modalBack.low{padding-bottom:6px}
body.touch .hubBtn{min-height:calc(var(--tap)*var(--inv));min-width:calc(var(--tap)*var(--inv)*1.6);font-size:17px;display:flex;flex-direction:column;justify-content:center}
body.touch .huntBait{display:none}
body.touch #sndPanel.tpanel{position:fixed;right:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,420px);font-size:17px;padding:14px 18px;z-index:90}
body.touch #sndPanel.tpanel label{margin:14px 0}
body.touch #sndPanel.tpanel input{height:44px}
body.touch #sndPanel.tpanel .sndTitle{font-size:20px}
body.touch #sndPanel.tpanel .sndNote{font-size:13px}
.tpClose{display:none}
body.touch #sndPanel.tpanel .tpClose{display:block;margin:8px auto 0;font:bold 17px 'Trebuchet MS','Liberation Sans',Arial,Roboto,sans-serif;min-height:48px;min-width:140px;border-radius:10px;border:3px solid #203731;background:#ffb612;color:#203731}
#sndPanel .tgl{display:none}
body.touch #sndPanel.tpanel .tgl{display:flex}
</style>

<body>
<div id="wrap">
  <div id="hud">
    <span id="money">$0</span>
    <span id="beers"></span>
    <span id="buzz"></span>
    <span id="mode"></span>
    <button id="mapBtn" title="Back to the map">🗺 Map</button>
    <button id="sndBtn" title="Music &amp; SFX volume">🎚</button>
    <button id="muteBtn" title="Toggle sound (M)">🔊</button>
  </div>
  <div id="sndPanel" style="display:none">
    <div class="sndTitle">🎚 Sound mixer</div>
    <label>🎵 Music <input type="range" id="volMusic" min="0" max="100" step="1"><span id="volMusicV"></span></label>
    <label>🔔 SFX &amp; voices <input type="range" id="volSfx" min="0" max="100" step="1"><span id="volSfxV"></span></label>
    <label class="tgl">📳 Vibration <input type="checkbox" id="hapT" style="flex:0 0 28px;height:28px"></label>
    <div class="sndNote">M (or 🔊) = mute everything. Settings save automatically. All sounds are synthesized live — no recordings.</div>
    <button class="tpClose" id="sndClose">Done</button>
  </div>
  <canvas id="cv" width="960" height="600"></canvas>
  <div id="ui"></div>
</div>
<div id="tc"></div>
<div id="rot"><div class="ph">📱</div><h2>Rotate your phone</h2><p id="rotMsg">Cheesehead plays best sideways — like a snowmobile in the ditch.</p><button id="rotFs">⛶ Fullscreen &amp; rotate</button><button id="rotGo" class="alt">Play anyway</button></div>
<script>
'use strict';
/* =====================================================================
   CHEESEHEAD — a Sconnie snowmobile / ice-fishing / bow-hunting /
   Packers-betting simulator. Single file, no network. Made for Anton.
   Phrase checklist lives in PHRASES.md next to this file and is verified
   by check_phrases.sh (grep over the built HTML, comments stripped).
   ===================================================================== */
const W = 960, H = 600;
var IS_TOUCH = false; // set by setTouchMode() in 85_touch.js
// canvas fonts: give every ctx.font a sans-serif fallback (Android/Linux have no Trebuchet MS)
(function () { const P = CanvasRenderingContext2D.prototype, d = Object.getOwnPropertyDescriptor(P, 'font'); if (!d || !d.set) return; const cache = new Map();
  Object.defineProperty(P, 'font', { configurable: true, get() { return d.get.call(this); }, set(v) { let f = cache.get(v); if (f === undefined) { f = /(sans-serif|serif|monospace)\s*$/.test(v) ? v : v + ", 'Liberation Sans', Arial, Roboto, Helvetica, sans-serif"; if (cache.size < 2000) cache.set(v, f); } d.set.call(this, f); } }); })();
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const UI = document.getElementById('ui');
const wrap = document.getElementById('wrap');
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => '$' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function lb(arr, z) { let lo = 0, hi = arr.length; while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].z < z) lo = m + 1; else hi = m; } return lo; }

/* ----------------------------- SAVE ----------------------------- */
const SAVE_KEY = 'cheesehead_save_v1';
function defSave() {
  return { v: 1, dollars: 100, beers: 0, totalBeers: 0, curds: 0, sausage: 0,
    sled: [], bow: [], bowOff: [], shots: 0, hits: 0,
    raceUnlocked: 1, racesWon: 0, racesRun: 0,
    bestMuskie: 0, muskies: 0, bestBuck: 0, bucks: 0,
    betW: 0, betL: 0, betNet: 0, betHist: [], mute: false, musicVol: 0.7, sfxVol: 0.9, started: false, sledColor: 'packers', autoGas: false, tilt: false, haptics: true };
}
let S = defSave();
function loadSave() {
  try { const r = localStorage.getItem(SAVE_KEY); S = Object.assign(defSave(), r ? JSON.parse(r) : {}); }
  catch (e) { S = defSave(); }
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { } }
function wipeSave() { S = defSave(); save(); updHud(); }
const hasSled = id => S.sled.includes(id);
const hasBow = id => S.bow.includes(id) && !S.bowOff.includes(id);

/* AUDIO lives in 15_audio.js / 17_sfx.js / 18_music.js / 19_snd.js */

/* ----------------------------- INPUT ---------------------------- */
const keys = {};
const K = {
  up: () => keys['arrowup'] || keys['w'],
  down: () => keys['arrowdown'] || keys['s'],
  left: () => keys['arrowleft'] || keys['a'],
  right: () => keys['arrowright'] || keys['d'],
  space: () => keys[' ']
};
const mouse = { x: W / 2, y: H / 2, down: false, moved: false, pid: null, touch: false, t0: 0, aimOnly: false };
const AIM_OFF = 78; // touch: crosshair floats this far above the finger so it isn't hidden
addEventListener('keydown', e => {
  audio();
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key.toLowerCase();
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) e.preventDefault();
  const wasDown = keys[k];
  keys[k] = true;
  if (e.repeat || wasDown) return;
  if (modalKey(e)) return;
  if (k === 'm') { toggleMute(); return; }
  if (scene && scene.key) scene.key(k, e);
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'shift') keys['shift'] = false;
  if (scene && scene.keyup) scene.keyup(k);
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
function canvasPos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
// Pointer Events unify mouse + touch + pen. Touch: one finger drives the canvas; the others are free for on-screen buttons.
function pointerTo(e) { const [x, y] = canvasPos(e); mouse.x = x; mouse.y = (e.pointerType !== 'mouse' && scene === Hunt) ? y - AIM_OFF : y; mouse.moved = true; }
cv.addEventListener('pointermove', e => { if (mouse.pid != null && e.pointerId !== mouse.pid) return; if (mouse.pid == null && e.pointerType !== 'mouse') return; pointerTo(e); });
cv.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') { setTouchMode(true); e.preventDefault(); }
  else if (e.button !== 0) return;
  audio();
  if (mouse.pid != null && mouse.pid !== e.pointerId) return;
  mouse.pid = e.pointerId; try { cv.setPointerCapture(e.pointerId); } catch (er) { }
  pointerTo(e); mouse.down = true; mouse.touch = e.pointerType !== 'mouse'; mouse.t0 = performance.now();
  mouse.aimOnly = mouse.touch && scene === Hunt && TC.drawHeld; // DRAW button held: this finger only aims
  if (!mouse.aimOnly && scene && scene.mousedown) scene.mousedown(e);
});
function pointerEnd(e) { if (mouse.pid == null || e.pointerId !== mouse.pid) return; mouse.pid = null; if (mouse.down) { mouse.down = false; const ao = mouse.aimOnly; mouse.aimOnly = false; if (!ao && scene && scene.mouseup) scene.mouseup(e); } }
addEventListener('pointerup', pointerEnd); addEventListener('pointercancel', pointerEnd);
// buttons never steal focus (so SPACE never re-clicks a button)
document.addEventListener('mousedown', e => { if (e.target.closest && e.target.closest('button')) { e.preventDefault(); audio(); } });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('contextmenu', e => { if (IS_TOUCH) e.preventDefault(); });

/* ----------------------------- UI: modal / toast ---------------- */
let modalEl = null, modalButtons = [], modalOpened = 0;
function modal(html, buttons, opts = {}) {
  closeModal();
  const back = document.createElement('div');
  back.className = 'modalBack' + (opts.low ? ' low' : '');
  const m = document.createElement('div');
  m.className = 'modal';
  if (opts.width) m.style.maxWidth = opts.width + 'px';
  m.innerHTML = tk(html);
  const bar = document.createElement('div'); bar.className = 'btnbar';
  modalButtons = buttons.map((b, i) => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.innerHTML = tk(b.label) + (buttons.length > 1 ? ` <small class="kh">[${b.def ? 'Enter' : i + 1}]</small>` : ' <small class="kh">[Enter]</small>');
    if (b.disabled) el.disabled = true;
    el.onclick = () => { SFX.click(); if (!b.keep) closeModal(); if (b.fn) b.fn(); };
    bar.appendChild(el);
    return Object.assign({ el }, b);
  });
  m.appendChild(bar); back.appendChild(m); UI.appendChild(back);
  modalEl = back; modalOpened = performance.now(); SFX.modal();
  return m;
}
function closeModal() { if (modalEl) { modalEl.remove(); modalEl = null; modalButtons = []; } }
function modalKey(e) {
  if (!modalEl) return false;
  if (performance.now() - modalOpened < 350) return true; // swallow carry-over mashing
  const k = e.key;
